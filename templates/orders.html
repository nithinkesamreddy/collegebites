{% extends "base.html" %}

{% block title %}Manage Orders | CollegeBites{% endblock %}

{% block content %}
<main class="container page">
    <section class="page-heading">
        <div>
            <p class="eyebrow">CANTEEN DESK</p>
            <h1>Manage Orders</h1>
            <p>Track incoming orders and move them through the kitchen.</p>
        </div>
        <button id="refresh-orders" class="btn btn-secondary" type="button">
            Refresh
        </button>
    </section>

    <div id="order-banner" class="alert alert-success" role="status" hidden></div>
    <div id="orders-message" class="alert alert-info" role="status">
        Loading orders...
    </div>

    <div id="status-filters" class="filters"></div>
    <div id="orders-list" class="orders-list"></div>
</main>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/orders.js') }}" defer></script>
{% endblock %}
