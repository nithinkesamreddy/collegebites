<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CampusBite | Manage Orders</title>
  <meta name="description" content="Track and manage all CampusBite canteen orders in real time.">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

  <!-- NAVBAR -->
  <header class="navbar">
    <a class="brand" href="/">Campus<span>Bite</span></a>
    <nav class="navbar-right">
      <a class="nav-link" href="/">Menu</a>
      <a class="nav-link active" href="/orders">Manage Orders</a>
      <a class="nav-cart-btn" href="/cart" id="nav-cart-link">
        🛒 Cart <span id="cart-count">0</span>
      </a>
    </nav>
  </header>

  <main class="container">

    <!-- PAGE HERO -->
    <div class="page-hero">
      <h1>📋 Manage Orders</h1>
      <p>View and update all canteen orders in real time.</p>
    </div>

    <section class="orders-section">

      <!-- Refresh bar -->
      <div class="refresh-bar">
        <p id="orders-summary-text">Loading orders…</p>
        <button id="btn-refresh" class="btn-refresh">
          <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" fill="none"
               viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
          </svg>
          Refresh
        </button>
      </div>

      <!-- Status filters -->
      <div class="orders-controls" id="status-filters">
        <button class="status-filter active" data-status="All">All</button>
        <button class="status-filter" data-status="Pending">⏳ Pending</button>
        <button class="status-filter" data-status="Preparing">👨‍🍳 Preparing</button>
        <button class="status-filter" data-status="Ready">✅ Ready</button>
        <button class="status-filter" data-status="Completed">📦 Completed</button>
      </div>

      <!-- Orders list -->
      <div id="orders-status" role="status" aria-live="polite"></div>
      <div id="orders-grid" class="orders-grid"></div>

    </section>

  </main>

  <footer>
    <span class="footer-brand">CampusBite</span>
    <span>© 2026 · Made for campus life 🎓</span>
  </footer>

  <script src="{{ url_for('static', filename='js/orders.js') }}"></script>
</body>
</html>
