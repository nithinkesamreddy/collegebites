<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CampusBite | Food Menu</title>
  <meta name="description" content="Browse today's canteen menu at CampusBite. Order your favourite campus meals — Breakfast, Snacks, Meals and Drinks.">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

  <!-- NAVBAR -->
  <header class="navbar">
    <a class="brand" href="/">Campus<span>Bite</span></a>
    <nav class="navbar-right">
      <a class="nav-link active" href="/">Menu</a>
      <a class="nav-link" href="/orders">Manage Orders</a>
      <a class="nav-cart-btn" href="/cart" id="nav-cart-link">
        🛒 Cart <span id="cart-count">0</span>
      </a>
    </nav>
  </header>

  <main class="container">

    <!-- HERO -->
    <section class="hero">
      <p class="hero-badge">🍴 Your Campus, Your Food</p>
      <h1>Hungry? We've got<br><span class="highlight">you covered.</span></h1>
      <p>Discover fresh, tasty meals from your campus canteen — order in minutes.</p>
    </section>

    <!-- MENU -->
    <section class="menu-section">
      <div class="section-heading">
        <div>
          <h2>Today's Menu</h2>
          <p>Fresh picks from your campus canteen.</p>
        </div>
        <div class="search-wrap">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none"
               viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
          </svg>
          <input id="search-input" type="search"
                 placeholder="Search food…"
                 aria-label="Search food items"
                 autocomplete="off">
        </div>
      </div>

      <div id="category-filters" class="filters"></div>

      <div id="menu-status" role="status" aria-live="polite"></div>
      <div id="menu-grid" class="menu-grid"></div>
    </section>

  </main>

  <footer>
    <span class="footer-brand">CampusBite</span>
    <span>© 2026 · Made for campus life 🎓</span>
  </footer>

  <script src="{{ url_for('static', filename='js/menu.js') }}"></script>
</body>
</html>
